<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phone microphone · CustomAi MedScribe</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/m/mic.css">
  <script src="/js/boot-check.js"></script>
</head>
<body class="phone-mic">
  <main class="pm-page">
    <div class="wordmark"><span class="mark" aria-hidden="true">M</span><span>CustomAi MedScribe</span></div>
    <div class="eyebrow">Phone microphone</div>
    <h1>Record the visit on this phone</h1>
    <p class="muted">The screen in the room shows the transcript and the note. Keep this phone near the conversation and this page open.</p>
    <noscript><div class="banner banner-critical">This page needs JavaScript.</div></noscript>
    <section class="card pm-card" id="pm"><div class="empty"><span class="spinner"></span></div></section>
    <p class="muted small">Synthetic demo: do not record real patient information. Nothing is recorded until you press Start.</p>
  </main>
  <script type="module" src="/m/mic.js"></script>
</body>
</html>
