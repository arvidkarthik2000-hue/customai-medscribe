# Render Blueprint: one web service with a small persistent disk.
# New > Blueprint > pick this repo. Render will ask for the two values marked
# sync: false (the API keys). They never live in the repo.
services:
  - type: web
    name: customai-medscribe
    runtime: python
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: medscribe-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
      - key: APP_SECRET
        generateValue: true
      # The code testers type to get in. To change it, edit this value and push
      # (a value set here wins over one set in the dashboard on the next sync).
      - key: DEMO_ACCESS_CODE
        value: cm-scribe-7419
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NOTE_MODEL
        value: claude-sonnet-5-5
      - key: FAST_MODEL
        value: claude-haiku-5-5
      - key: NOTE_EFFORT
        value: medium
      - key: DAILY_AUDIO_MINUTES
        value: "240"
      - key: MAX_VISIT_MINUTES
        value: "20"
